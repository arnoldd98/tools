<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Japan Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&display=swap">
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f6f3ea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japan Trip">
</head>
<body>
  <header class="top">
    <div id="top" class="top-row"></div>
    <p id="status" class="muted" role="status"></p>
    <button id="update" class="btn update" hidden>Updated, tap to reload</button>
  </header>

  <main id="view"></main>

  <details id="tools" class="tools" hidden>
    <summary>Settings</summary>
    <form id="fx" class="fx">
      <label>1 SGD = <input name="rate" inputmode="decimal" size="6"> JPY</label>
      <button class="btn" type="submit">Save rate</button>
      <button class="btn" type="button" data-action="fetch-fx">Fetch latest</button>
      <span id="fx-updated" class="muted"></span>
    </form>
    <div class="tool-buttons">
      <button class="btn" data-action="export">Export JSON</button>
      <label class="btn">Import JSON<input id="import" type="file" accept="application/json" hidden></label>
      <button class="btn" data-action="reload">Reload from GitHub</button>
    </div>
    <details class="settings">
      <summary>Sync settings</summary>
      <form id="settings">
        <label>Repo owner <input name="owner"></label>
        <label>Repo name <input name="repo"></label>
        <label>Branch <input name="branch"></label>
        <label>Data file path <input name="path"></label>
        <label>GitHub token (fine-grained, Contents: read &amp; write, this repo only)
          <input name="token" type="password" autocomplete="off"></label>
        <button class="btn" type="submit">Save settings</button>
        <p class="muted">The token is stored only in this browser (localStorage).</p>
      </form>
    </details>
  </details>

  <div id="tabs"></div>

  <div id="sheet" class="sheet" hidden>
    <div class="backdrop" data-action="close-spend"></div>
    <div id="sheet-body"></div>
  </div>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
