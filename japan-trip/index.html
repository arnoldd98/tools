<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Japan Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&display=swap">
  <link rel="stylesheet" href="style.css?v=25">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Japan Trip">
</head>
<body>
  <header class="top">
    <div id="top" class="top-row"></div>
    <p id="status" class="muted" role="status"></p>
    <button id="update" class="btn update" data-i18n="update" hidden>Updated, tap to reload</button>
  </header>

  <main id="view"></main>

  <details id="tools" class="tools" hidden>
    <summary data-i18n="settings">Settings</summary>
    <section class="set-group">
      <h4 data-i18n="rateHeading">Exchange rate</h4>
      <form id="fx" class="fx">
        <label class="rate-line">1 SGD = <input name="rate" inputmode="decimal" size="6"> JPY</label>
        <div class="set-actions">
          <button class="btn" type="submit" data-i18n="saveRate">Save rate</button>
          <button class="btn" type="button" data-action="fetch-fx" data-i18n="fetchLatest">Fetch latest</button>
        </div>
        <p id="fx-updated" class="muted"></p>
      </form>
    </section>
    <section class="set-group">
      <h4 data-i18n="backupHeading">Backup</h4>
      <div class="set-actions">
        <button class="btn" data-action="export" data-i18n="export">Export JSON</button>
        <label class="btn"><span data-i18n="import">Import JSON</span><input id="import" type="file" accept="application/json" hidden></label>
        <button class="btn" data-action="reload" data-i18n="reload">Reload from GitHub</button>
      </div>
    </section>
    <section class="set-group">
      <h4 data-i18n="syncHeading">Sync</h4>
    <details class="settings">
      <summary data-i18n="syncSettings">Sync settings</summary>
      <form id="settings">
        <label><span data-i18n="owner">Repo owner</span> <input name="owner"></label>
        <label><span data-i18n="repo">Repo name</span> <input name="repo"></label>
        <label><span data-i18n="branch">Branch</span> <input name="branch"></label>
        <label><span data-i18n="path">Data file path</span> <input name="path"></label>
        <label><span data-i18n="token">GitHub token (fine-grained, Contents: read &amp; write, this repo only)</span>
          <input name="token" type="password" autocomplete="off"></label>
        <button class="btn" type="submit" data-i18n="saveSettings">Save settings</button>
        <p class="muted" data-i18n="tokenNote">The token is stored only in this browser (localStorage).</p>
      </form>
    </details>
    </section>
  </details>

  <div id="tabs"></div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="sheet" class="sheet" hidden>
    <div class="backdrop" data-action="close-spend"></div>
    <div id="sheet-body"></div>
  </div>

  <script type="module" src="app.js?v=25"></script>
</body>
</html>
